<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller Arena</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../style.css">
<style>
  .arena{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
  @media(max-width:860px){.arena{grid-template-columns:1fr}}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:.92rem;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stage{position:relative}
  #view{border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;background:#f6f7f9}
  #view canvas{display:block;width:100%;cursor:grab}
  #banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:.9rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap}
  #banner.fail{border-color:#dc2626;color:#dc2626}
  #banner.ok{border-color:#0d9488}
  #chart{width:100%;height:170px;display:block;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:12px}
  .panel{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);margin-bottom:14px}
  .panel h3{margin:0 0 8px;font-size:.95rem}
  .row{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 5.8rem;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
  .row input[type=range]{width:100%;min-width:0}
  .row output{font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
  .seg{display:flex;gap:8px;margin-bottom:8px}
  .seg button,.btns button{flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #metrics{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 0}
  #metrics div{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 9px;min-width:5.2rem}
  #metrics small{display:block;font-size:.68rem;color:var(--muted);line-height:1.2}
  #metrics b{font:600 .85rem ui-monospace,monospace;white-space:nowrap}
  #status{font-size:.8rem;color:var(--muted)}
  select{font:inherit;padding:4px}
  .legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 12px}
  @media(max-width:520px){.row{grid-template-columns:6rem minmax(0,1fr) 5rem;font-size:.82rem}}
</style>
</head>
<body>
<header class="top"><a href="../index.html">&larr; Portfolio</a></header>
<main class="wrap">
  <h1>Controller Arena</h1>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Task"></nav>
  <p class="lead" id="blurb"></p>
  <div class="arena">
    <section>
      <div class="stage"><div id="view" aria-label="arm simulation"></div><div id="banner" hidden></div></div>
      <div id="metrics" aria-live="off"></div>
      <canvas id="chart" aria-label="error over time"></canvas>
      <p class="legend small" id="legend"></p>
      <p id="status" role="status">starting ...</p>
    </section>
    <aside>
      <div class="panel">
        <h3>Controller: <span id="ctl-name"></span></h3>
        <div class="seg" id="ctl-seg"></div>
        <div id="ctl-panels"></div>
      </div>
      <div class="panel">
        <h3>Task and weaknesses</h3>
        <div id="task-controls"></div>
        <div class="row"><label for="speed">speed</label><select id="speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select><span></span></div>
        <div class="row"><label for="loop">repeat episode</label><input id="loop" type="checkbox" checked><span></span></div>
        <p class="small" id="weak-note"></p>
        <div class="btns"><button id="reset">Restart</button><button id="pause">Pause</button></div>
      </div>
      <p class="small">Same arm, same task definitions, same controller code path as the Python arena (numerical comparison: <a href="VALIDATION.md">VALIDATION.md</a>). Each task is a plugin in <code>js/tasks/</code>.</p>
    </aside>
  </div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
